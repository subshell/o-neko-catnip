version: "2"
output:
  formats:
    text:
      path: stdout
    junit-xml:
      path: linter_results.xml
linters:
  enable:
    - promlinter
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
